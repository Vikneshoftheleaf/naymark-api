name: Deploy Cloudflare Container API

on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - "workers/api-gateway/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "requirements.lock"
      - ".github/workflows/build-and-test.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naymark-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ORIGIN_AUTH_TOKEN: ${{ secrets.ORIGIN_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -c requirements.lock -e ".[test]"
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: workers/api-gateway/package-lock.json
      - run: npm ci
        working-directory: workers/api-gateway
      - run: npm run typecheck
        working-directory: workers/api-gateway
      - run: npm run test
        working-directory: workers/api-gateway
      - run: docker build -t naymark-api:${{ github.sha }} .
      - name: Deploy Worker and Container
        working-directory: workers/api-gateway
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$ORIGIN_AUTH_TOKEN" ]; then
            echo "Required production environment secrets are missing." >&2
            exit 1
          fi
          npx wrangler deploy
          printf '%s' "$ORIGIN_AUTH_TOKEN" | npx wrangler secret put ORIGIN_AUTH_TOKEN
