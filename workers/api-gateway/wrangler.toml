name = "naymark-api"
main = "src/index.ts"
compatibility_date = "2026-11-19"
workers_dev = true

[vars]
REQUEST_LIMIT_BYTES = "10485760"
MULTIPART_OVERHEAD_BYTES = "65536"

[[ratelimits]]
name = "IMAGE_RATE_LIMIT"
namespace_id = "8472051"

  [ratelimits.simple]
  limit = 6
  period = 60

[[containers]]
class_name = "ApiContainer"
scheduling_policy = "durable_object"

  [containers.images.base]
  dockerfile = "../../Dockerfile"

[[durable_objects.bindings]]
name = "API_ORIGIN"
class_name = "ApiContainer"

[exports.ApiContainer]
type = "durable-object"
storage = "sqlite"
